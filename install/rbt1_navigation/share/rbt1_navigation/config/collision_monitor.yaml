collision_monitor:
  ros__parameters:
    use_sim_time: false

    observation_sources: ["scan"]

    scan:
      type: scan
      topic: /scan
      min_height: 0.0
      max_height: 1.0

    polygons: ["stop_zone", "slow_zone"]

    stop_zone:
      type: polygon
      action_type: stop
      min_points: 3
      points: [0.30, 0.25, 0.30, -0.25, -0.10, -0.25, -0.10, 0.25]

    slow_zone:
      type: polygon
      action_type: slowdown
      slowdown_ratio: 0.4
      min_points: 3
      points: [0.60, 0.35, 0.60, -0.35, -0.20, -0.35, -0.20, 0.35]

    base_frame_id: base_link
    odom_frame_id: odom
    transform_tolerance: 0.2
    source_timeout: 0.5

    min_linear_vel: 0.05
    min_angular_vel: 0.1