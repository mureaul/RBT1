slam_toolbox:

  ros__parameters:

    # --- GENERAL SETTINGS ---
    use_sim_time: false
    throttle_scans: 1
    transform_timeout: 0.2
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /rplidar/scan
    mode: mapping  # mapping / localization

    # --- LOOP CLOSURE ---
    loop_search_max_submaps: 5
    do_loop_closing: true
    loop_closure_sampling_ratio: 0.2
    constraint_search_radius: 10.0
    loop_closure_threshold: 1.0
    use_scan_matching: true

    # --- SENSOR MODEL ---
    max_laser_range: 12.0
    min_laser_range: 0.12
    resolution: 0.05
    minimum_time_interval: 0.0
    transform_publish_period: 0.05
    tf_buffer_duration: 30.

    # --- OPTIMIZATION ---
    optimization_frequency: 0.5
    max_iterations: 20
    linear_update: 0.2
    angular_update: 0.1
    temporal_update: 0.5

    # --- MOTION FILTER (for outdoor/semi-outdoor LiDAR) ---
    motion_model_coefficient_0: 0.1
    motion_model_coefficient_1: 0.1
    motion_model_coefficient_2: 0.1
    motion_model_coefficient_3: 0.1
    motion_model_coefficient_4: 0.1

    # --- MAP SAVING ---
    map_start_x: 0.0
    map_start_y: 0.0
    map_start_yaw: 0.0
    map_save_name: "rbt1_map"

    # --- CONTINUOUS MODE ---
    allow_unknown_initial_pose: true
    clear_map: false
    enable_interactive_mode: false

    # --- SCAN MATCHER ---
    adaptive_params:
      debug_verify_grid: false
      enlarge_bounds: true
      min_laser_range: 0.15
      inflate_width: 1.0
      upsample_factor: 1.0

    # --- LOCALIZATION MODE ---
    localization:
      enabled: true
      max_path_length: 1000
      map_load_filename: ""
      map_start_pose: [0.0, 0.0, 0.0]
      map_name: rbt1_map

