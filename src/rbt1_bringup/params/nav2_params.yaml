amcl:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    base_frame: base_link
    map_frame: map


map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /home/ubuntu/RBT1_ws/src/RBT1_bringup/maps/nav2_maps/map_nav2_Zone1.yaml


planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"


controller_server:
  ros__parameters:
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    FollowPath:
       plugin: "dwb_core::DWBLocalPlanner"

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: "navigate_w_replanning_and_recovery.xml"
