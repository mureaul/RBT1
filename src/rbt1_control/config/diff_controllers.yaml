controller_manager:
  ros__parameters:
    update_rate: 50


joint_state_broadcaster:
  ros__parameters: {}


diff_drive_controller:
  ros__parameters:
    type: "diff_drive_controller/DiffDriveController"
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.30
    wheel_radius: 0.1
    torque_limit: 2.0
    cmd_vel_timeout: 0.5
    publish_rate: 50

    # velocity PID on wheel velocity (example)
    left_wheel:
      pid:
        p: 2.0
        i: 0.5
        d: 0.05
    right_wheel:
      pid:
        p: 2.0
        i: 0.5
        d: 0.05

    odom_topic: /odom
    enable_odom_tf: true
