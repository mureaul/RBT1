amcl:
  ros__parameters:
    enable: false

bt_navigator:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      critics:
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      RotateToGoal:
        scale: 1.0
      GoalAlign:
        scale: 24.0
      PathAlign:
        scale: 32.0
      PathDist:
        scale: 32.0
      GoalDist:
        scale: 24.0
      ObstacleFootprint:
        scale: 0.01
      max_vel_x: 0.6
      min_vel_x: 0.0
      max_vel_theta: 1.0
      acc_lim_x: 1.0
      acc_lim_theta: 2.0
      vx_samples: 20
      vtheta_samples: 40
      sim_time: 1.5
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.3

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["SmacPlanner"]
    SmacPlanner:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 1.0
      use_astar: false
      allow_unknown: true

global_costmap:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    resolution: 0.2
    rolling_window: true
    width: 100
    height: 100
    plugins: ["obstacle_layer", "inflation_layer"]
    
    obstacle_layer:
      ros__parameters:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 10.0
          obstacle_max_range: 8.0
    
    inflation_layer:
      ros__parameters:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 3.0

local_costmap:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    resolution: 0.05
    plugins: ["obstacle_layer", "inflation_layer"]
    
    obstacle_layer:
      ros__parameters:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 10.0
          obstacle_max_range: 8.0
    
    inflation_layer:
      ros__parameters:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 3.0

behavior_server:
  ros__parameters:
    use_sim_time: false

collision_monitor:
  ros__parameters:
    use_sim_time: false

    observation_sources: ["scan"]

    scan:
      type: scan
      topic: /scan
      min_height: 0.0
      max_height: 1.0

    polygons: ["stop_zone", "slow_zone"]

    stop_zone:
      type: polygon
      action_type: stop
      min_points: 3
      points: "[[0.30, 0.25], [0.30, -0.25], [-0.10, -0.25], [-0.10, 0.2]]"

    slow_zone:
      type: polygon
      action_type: slowdown
      slowdown_ratio: 0.4
      min_points: 3
      points: "[[0.60, 0.35], [0.60, -0.35], [-0.20, -0.35], [-0.20, 0.35]]"

    base_frame_id: base_link
    odom_frame_id: odom
    transform_tolerance: 0.2
    source_timeout: 0.5

    min_linear_vel: 0.05
    min_angular_vel: 0.1

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    odom_topic: "odom"
    odom_duration: 0.3
    dock_backwards: false  # Deprecated, use dock_direction in plugin
    dock_prestaging_tolerance: 0.5
    introspection_mode: "disabled"

    # Types of docks
    dock_plugins: ['nova_carter_dock']
    nova_carter_dock:
      plugin: 'opennav_docking::SimpleChargingDock'  # Also 'opennav_docking::SimpleNonChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      detector_service_name: '/detector/toggle'
      detector_service_timeout: 5.0
      subscribe_toggle: true
      use_battery_status: false # true
      use_stall_detection: false
      rotate_to_dock: false

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      dock_direction: "forward" # "backward"

    # Dock instances
    docks: ['home_dock']
    home_dock:
      type: 'nova_carter_dock'
      frame: map
      pose: [0.0, 0.0, 0.0]